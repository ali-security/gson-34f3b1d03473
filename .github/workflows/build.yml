name: Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build with Maven
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn --batch-mode --update-snapshots verify -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false
          else
            mvn --batch-mode --update-snapshots verify
          fi
      - name: List skipped tests with reasons
        if: always()
        run: |
          for f in */target/surefire-reports/TEST-*.xml; do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              s = tc.find('skipped')
              if s is not None:
                  print("SKIPPED: %s.%s -- reason: %s" % (tc.get('classname'), tc.get('name'), (s.get('message') or s.text or '').strip()))
          PY
          done
      - name: Upload gson jar
        uses: actions/upload-artifact@v4
        with:
          name: gson-jar
          path: |
            gson/target/gson-*.jar
            !gson/target/gson-*-sources.jar
            !gson/target/gson-*-javadoc.jar
          if-no-files-found: error
